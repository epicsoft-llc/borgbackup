image: docker:latest

services:
  - docker:dind

stages:
  - build
  - version 
  - release

#### Borgbackup on alpine version 3.9
v3.9:
  stage: build
  before_script:
    - TAG_VERSION=3.9
    - BASE_IMAGE_VERSION=3.9
  script: &defaultBuildScript
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:$TAG_VERSION . --build-arg BASE_IMAGE_VERSION=$BASE_IMAGE_VERSION
    - docker run --rm $CI_REGISTRY_IMAGE:$TAG_VERSION --version
    - docker push $CI_REGISTRY_IMAGE:$TAG_VERSION
  only: &masterBranch
    - master
  tags: &sharedRunner
    - shared

v3.9-ARM:
  stage: build
  before_script:
    - TAG_VERSION=3.9-arm
    - BASE_IMAGE_VERSION=3.9
  script: *defaultBuildScript
  only: *masterBranch
  tags: &armRunner
    - arm
    - docker

#### Borgbackup on alpine version 3.10
v3.10:
  stage: build
  before_script:
    - TAG_VERSION=3.10
    - BASE_IMAGE_VERSION=3.10
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

v3.10-ARM:
  stage: build
  before_script:
    - TAG_VERSION=3.10-arm
    - BASE_IMAGE_VERSION=3.10
  script: *defaultBuildScript
  only: *masterBranch
  tags: *armRunner

#### Borgbackup on alpine version edge
edge:
  stage: build
  before_script:
    - TAG_VERSION=edge
    - BASE_IMAGE_VERSION=edge
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

edge-ARM:
  stage: build
  before_script:
    - TAG_VERSION=edge-arm
    - BASE_IMAGE_VERSION=edge
  script: *defaultBuildScript
  only: *masterBranch
  tags: *armRunner

#### Borgbackup stable 
Stable:
  stage: version
  variables:
    GIT_STRATEGY: none
  before_script: 
    - SOURCE_TAG=3.9
    - TARGET_TAG=stable
  script: &changeTagScript
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$SOURCE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$SOURCE_TAG $CI_REGISTRY_IMAGE:$TARGET_TAG
    - docker push $CI_REGISTRY_IMAGE:$TARGET_TAG
  only: *masterBranch
  tags: *sharedRunner

Stable-ARM:
  stage: version
  variables:
    GIT_STRATEGY: none
  before_script: 
    - SOURCE_TAG=3.9-arm
    - TARGET_TAG=stable-arm
  script: *changeTagScript
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup latest
Latest:
  stage: version
  variables:
    GIT_STRATEGY: none
  before_script: 
    - SOURCE_TAG=3.10
    - TARGET_TAG=latest
  script: *changeTagScript
  only: *masterBranch
  tags: *sharedRunner

Latest-ARM:
  stage: version
  variables:
    GIT_STRATEGY: none
  before_script: 
    - SOURCE_TAG=3.10-arm
    - TARGET_TAG=latest-arm
  script: *changeTagScript
  only: *masterBranch
  tags: *sharedRunner

#### Docker hub release
DockerHub:
  stage: release
  variables:
    GIT_STRATEGY: none
  before_script: 
    - DOCKER_REGISTRY="epicsoft/borgbackup"
    - STABLE_TAG=stable
    - LATEST_TAG=latest
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
  script: &releaseScript
    - docker pull $CI_REGISTRY_IMAGE:$STABLE_TAG
    - docker pull $CI_REGISTRY_IMAGE:$LATEST_TAG
    - docker tag $CI_REGISTRY_IMAGE:$STABLE_TAG $DOCKER_REGISTRY:$STABLE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$LATEST_TAG $DOCKER_REGISTRY:$LATEST_TAG
    - docker push $DOCKER_REGISTRY:$STABLE_TAG
    - docker push $DOCKER_REGISTRY:$LATEST_TAG
  only: *masterBranch
  tags: *sharedRunner

DockerHub-ARM:
  stage: release
  variables:
    GIT_STRATEGY: none
  before_script: 
    - DOCKER_REGISTRY="epicsoft/borgbackup"
    - STABLE_TAG=stable-arm
    - LATEST_TAG=latest-arm
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
  script: *releaseScript
  only: *masterBranch
  tags: *sharedRunner

