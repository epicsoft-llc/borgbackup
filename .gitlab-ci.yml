image: docker:latest

services:
  - docker:dind

stages:
  - build
  - version
  - release

#### Borgbackup on alpine version latest
latest:
  stage: build
  before_script:
    - TAG_VERSION=latest
    - BASE_IMAGE_VERSION=latest
  script: &defaultBuildScript
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:$TAG_VERSION . --build-arg BASE_IMAGE_VERSION=$BASE_IMAGE_VERSION
    - docker run --rm $CI_REGISTRY_IMAGE:$TAG_VERSION --version
    - docker push $CI_REGISTRY_IMAGE:$TAG_VERSION
  only: &masterBranch
    - master
  tags: &sharedRunner
    - shared

#### Borgbackup on alpine version edge
edge:
  stage: build
  before_script:
    - TAG_VERSION=edge
    - BASE_IMAGE_VERSION=edge
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup on alpine version 3.13
v3.13:
  stage: build
  before_script:
    - TAG_VERSION=3.13
    - BASE_IMAGE_VERSION=3.13
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup stable
Stable:
  stage: version
  variables:
    GIT_STRATEGY: none
  before_script:
    - SOURCE_TAG=3.13
    - TARGET_TAG=stable
  after_script:
    - docker logout $CI_REGISTRY
  script: &changeTagScript
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$SOURCE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$SOURCE_TAG $CI_REGISTRY_IMAGE:$TARGET_TAG
    - docker push $CI_REGISTRY_IMAGE:$TARGET_TAG
  only: *masterBranch
  tags: *sharedRunner

#### Docker hub release
DockerHub:
  stage: release
  variables:
    GIT_STRATEGY: none
  before_script:
    - DOCKER_REGISTRY="epicsoft/borgbackup"
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
  after_script:
    - docker logout
  script: &releaseScript
    #### latest
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_REGISTRY:latest
    - docker push $DOCKER_REGISTRY:latest
    #### stable
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_REGISTRY:stable
    - docker push $DOCKER_REGISTRY:stable
    #### edge
    - docker pull $CI_REGISTRY_IMAGE:edge
    - docker tag $CI_REGISTRY_IMAGE:edge $DOCKER_REGISTRY:edge
    - docker push $DOCKER_REGISTRY:edge
  only: *masterBranch
  tags: *sharedRunner

#### Quay IO release
QuayIO:
  stage: release
  variables:
    GIT_STRATEGY: none
  before_script:
    - DOCKER_REGISTRY="quay.io/epicsoft/borgbackup"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
  after_script:
    - docker logout quay.io
  script: *releaseScript
  only: *masterBranch
  tags: *sharedRunner
