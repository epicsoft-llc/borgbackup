image: docker:latest

services:
  - docker:dind

stages:
  - build
  - release

variables:
  GIT_STRATEGY: none

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script: 
  - docker logout
  - docker logout quay.io
  - docker logout $CI_REGISTRY

GitLab:
  stage: build
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:stable -f stable.Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:stable
    - docker build --pull -t $CI_REGISTRY_IMAGE:latest -f latest.Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

DockerHub:
  stage: release
  script:
    - export DOCKER_HUB_IMAGE="epicsoft/borgbackup"
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_HUB_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:stable
    - docker push $DOCKER_HUB_IMAGE:latest
  only:
    - master

QuayIO:
  stage: release
  script:
    - export QUAY_IO_IMAGE="quay.io/epicsoft/borgbackup"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $QUAY_IO_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $QUAY_IO_IMAGE:latest
    - docker push $QUAY_IO_IMAGE:stable
    - docker push $QUAY_IO_IMAGE:latest
  only:
    - master
