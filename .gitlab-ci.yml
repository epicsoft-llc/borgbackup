stages:
  - build
  - version
  - release

image: docker:latest

services:
  - docker:dind

variables:
  DOCKER_REGISTRY: "epicsoft/borgbackup"
  BUILDX_NO_DEFAULT_ATTESTATIONS: "1"

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_TOKEN"

after_script:
  - docker logout
  - docker logout $CI_REGISTRY

latest:
  stage: build
  variables:
    TAG_VERSION: latest
    BASE_IMAGE_VERSION: latest
  script: &defaultBuildScript
    - echo "Build BorgBackup Docker image with version '${TAG_VERSION}'"
    - docker buildx use epicbuilder > /dev/null 2>&1 || docker buildx create --name epicbuilder --use > /dev/null 2>&1 && docker buildx inspect epicbuilder --bootstrap > /dev/null 2>&1
    - docker buildx build . --push --pull --no-cache
        --platform linux/amd64,linux/arm64
        -t $CI_REGISTRY_IMAGE:$TAG_VERSION
        -t $DOCKER_REGISTRY:$TAG_VERSION
        --build-arg IMAGE_TAG=$BASE_IMAGE_VERSION
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - docker run --rm $CI_REGISTRY_IMAGE:$TAG_VERSION --version
  only:
    - master

edge:
  stage: build
  variables:
    TAG_VERSION: edge
    BASE_IMAGE_VERSION: edge
  script: *defaultBuildScript
  only:
    - master

v3.21:
  stage: build
  variables:
    TAG_VERSION: "3.21"
    BASE_IMAGE_VERSION: "3.21"
  script: *defaultBuildScript
  only:
    - master

stable:
  stage: version
  variables:
    SOURCE_TAG: "3.21"
    TARGET_TAG: stable
    GIT_STRATEGY: none
  script:
    - docker pull $CI_REGISTRY_IMAGE:$SOURCE_TAG
    - docker tag $CI_REGISTRY_IMAGE:$SOURCE_TAG $CI_REGISTRY_IMAGE:$TARGET_TAG
    - docker push $CI_REGISTRY_IMAGE:$TARGET_TAG
  only:
    - master

uploadReadme:
  stage: release
  script:
    - docker run --rm -v $PWD:/workspace
      -e DOCKERHUB_USERNAME=${DOCKER_HUB_USER}
      -e DOCKERHUB_PASSWORD=${DOCKER_HUB_TOKEN}
      -e DOCKERHUB_REPOSITORY=${DOCKER_REGISTRY}
      -e SHORT_DESCRIPTION="Simple BorgBackup Docker Image"
      -e README_FILEPATH='/workspace/README.md'
        peterevans/dockerhub-description:4
  retry: 2
  only:
    - master
