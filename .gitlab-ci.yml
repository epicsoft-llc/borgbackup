image: docker:latest

services:
  - docker:dind

stages:
  - build
  - version 
  - release

#### Borgbackup on alpine version 3.9
v3.9:
  stage: build
  before_script:
    - TAG_VERSION=3.9
    - BASE_IMAGE_VERSION=3.9
  script: &defaultBuildScript
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --pull -t $CI_REGISTRY_IMAGE:$TAG_VERSION . --build-arg BASE_IMAGE_VERSION=$BASE_IMAGE_VERSION
    - docker run --rm $CI_REGISTRY_IMAGE:$TAG_VERSION --version
    - docker push $CI_REGISTRY_IMAGE:$TAG_VERSION
  only: &masterBranch
    - master
  tags: &sharedRunner
    - shared

v3.9-ARM:
  stage: build
  before_script:
    - TAG_VERSION=3.9-arm
    - BASE_IMAGE_VERSION=3.9
  script: *defaultBuildScript
  only: *masterBranch
  tags: &armRunner
    - arm
    - docker

#### Borgbackup on alpine version 3.10
v3.10:
  stage: build
  before_script:
    - TAG_VERSION=3.10
    - BASE_IMAGE_VERSION=3.10
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

v3.10-ARM:
  stage: build
  before_script:
    - TAG_VERSION=3.10-arm
    - BASE_IMAGE_VERSION=3.10
  script: *defaultBuildScript
  only: *masterBranch
  tags: *armRunner

#### Borgbackup on alpine version edge
edge:
  stage: build
  before_script:
    - TAG_VERSION=edge
    - BASE_IMAGE_VERSION=edge
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

edge-ARM:
  stage: build
  before_script:
    - TAG_VERSION=edge-arm
    - BASE_IMAGE_VERSION=edge
  script: *defaultBuildScript
  only: *masterBranch
  tags: *armRunner

#### Borgbackup stable 
Stable:
  stage: version
  variables:
    GIT_STRATEGY: none
  script:
    - BORGBACKUP_STABLE=3.9
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE $CI_REGISTRY_IMAGE:stable
    - docker push $CI_REGISTRY_IMAGE:stable
    #### ARM
    - BORGBACKUP_STABLE_ARM=$BORGBACKUP_STABLE-arm
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE_ARM
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE_ARM $CI_REGISTRY_IMAGE:stable-arm
    - docker push $CI_REGISTRY_IMAGE:stable-arm
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup latest
Latest:
  stage: version
  variables:
    GIT_STRATEGY: none
  script:
    - BORGBACKUP_LATEST=3.10
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
    #### ARM
    - BORGBACKUP_LATEST_ARM=$BORGBACKUP_LATEST-arm
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST_ARM
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST_ARM $CI_REGISTRY_IMAGE:latest-arm
    - docker push $CI_REGISTRY_IMAGE:latest-arm
  only: *masterBranch
  tags: *sharedRunner

#### Docker hub release
DockerHub:
  stage: release
  variables:
    GIT_STRATEGY: none
  script:
    - DOCKER_HUB_IMAGE="epicsoft/borgbackup"
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_HUB_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:stable
    - docker push $DOCKER_HUB_IMAGE:latest
    #### ARM
    - docker pull $CI_REGISTRY_IMAGE:stable-arm
    - docker pull $CI_REGISTRY_IMAGE:latest-arm
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_HUB_IMAGE:stable-arm
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest-arm
    - docker push $DOCKER_HUB_IMAGE:stable-arm
    - docker push $DOCKER_HUB_IMAGE:latest-arm
  only: *masterBranch
  tags: *sharedRunner

#### Quay IO release
QuayIO:
  stage: release
  variables:
    GIT_STRATEGY: none
  script:
    - QUAY_IO_IMAGE="quay.io/epicsoft/borgbackup"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $QUAY_IO_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $QUAY_IO_IMAGE:latest
    - docker push $QUAY_IO_IMAGE:stable
    - docker push $QUAY_IO_IMAGE:latest
    #### ARM
    - docker pull $CI_REGISTRY_IMAGE:stable-arm
    - docker pull $CI_REGISTRY_IMAGE:latest-arm
    - docker tag $CI_REGISTRY_IMAGE:stable $QUAY_IO_IMAGE:stable-arm
    - docker tag $CI_REGISTRY_IMAGE:latest $QUAY_IO_IMAGE:latest-arm
    - docker push $QUAY_IO_IMAGE:stable-arm
    - docker push $QUAY_IO_IMAGE:latest-arm
  only: *masterBranch
  tags: *sharedRunner
