image: docker:latest

services:
  - docker:dind

stages:
  - build
  - version 
  - release

before_script:
  - export BORGBACKUP_STABLE=3.8
  - export BORGBACKUP_LATEST=3.9WA
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script: 
  - docker logout
  - docker logout quay.io
  - docker logout $CI_REGISTRY

#### Borgbackup on alpine version 3.7
v3.7:
  stage: build
  before_script:
    - TAG_VERSION=3.7
  script: &defaultBuildScript
    - docker build --pull -t $CI_REGISTRY_IMAGE:$TAG_VERSION . --build-arg BASE_IMAGE_VERSION=$TAG_VERSION
    - docker run --rm $CI_REGISTRY_IMAGE:$TAG_VERSION --version
    - docker push $CI_REGISTRY_IMAGE:$TAG_VERSION
  only: &masterBranch
    - master
  tags: &sharedRunner
    - shared

#### Borgbackup on alpine version 3.8
v3.8:
  stage: build
  before_script:
    - TAG_VERSION=3.8
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup on alpine version 3.9
v3.9:
  stage: build
  before_script:
    - TAG_VERSION=3.9
  script: *defaultBuildScript
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup on alpine version 3.9 with workaround 
v3.9_WA:
  stage: build
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:3.9WA -f v3.9_WA.Dockerfile .
    - docker run --rm $CI_REGISTRY_IMAGE:3.9WA --version
    - docker push $CI_REGISTRY_IMAGE:3.9WA
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup on alpine version edge
edge:
  stage: build
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:edge . --build-arg BASE_IMAGE_VERSION=edge
    - docker run --rm $CI_REGISTRY_IMAGE:edge --version
    - docker push $CI_REGISTRY_IMAGE:edge
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup stable 
Stable:
  stage: version
  variables:
    GIT_STRATEGY: none
  script:
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_STABLE $CI_REGISTRY_IMAGE:stable
    - docker push $CI_REGISTRY_IMAGE:stable
  only: *masterBranch
  tags: *sharedRunner

#### Borgbackup latest
Latest:
  stage: version
  variables:
    GIT_STRATEGY: none
  script:
    - docker pull $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST
    - docker tag $CI_REGISTRY_IMAGE:$BORGBACKUP_LATEST $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only: *masterBranch
  tags: *sharedRunner

#### Docker hub release
DockerHub:
  stage: release
  variables:
    GIT_STRATEGY: none
  script:
    - export DOCKER_HUB_IMAGE="epicsoft/borgbackup"
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_HUB_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:stable
    - docker push $DOCKER_HUB_IMAGE:latest
  only: *masterBranch
  tags: *sharedRunner

#### Quay IO release
QuayIO:
  stage: release
  variables:
    GIT_STRATEGY: none
  script:
    - export QUAY_IO_IMAGE="quay.io/epicsoft/borgbackup"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $QUAY_IO_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $QUAY_IO_IMAGE:latest
    - docker push $QUAY_IO_IMAGE:stable
    - docker push $QUAY_IO_IMAGE:latest
  only: *masterBranch
  tags: *sharedRunner
