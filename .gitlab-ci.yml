image: docker:latest

services:
  - docker:dind

stages:
  - build
  - version 
  - release

variables:
  GIT_STRATEGY: none

before_script:
  - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY

after_script: 
  - docker logout
  - docker logout quay.io
  - docker logout $CI_REGISTRY

v3.7:
  stage: build
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:3.7 . --build-arg BASE_IMAGE_VERSION=3.7
    - docker run --rm $CI_REGISTRY_IMAGE:3.7 --version
    - docker push $CI_REGISTRY_IMAGE:3.7
  only:
    - master

v3.8:
  stage: build
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:3.8 . --build-arg BASE_IMAGE_VERSION=3.8
    - docker run --rm $CI_REGISTRY_IMAGE:3.8 --version
    - docker push $CI_REGISTRY_IMAGE:3.8
  only:
    - master

v3.9:
  stage: build
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:3.9 -f v3.9.Dockerfile . 
    - docker run --rm $CI_REGISTRY_IMAGE:3.9 --version
    - docker push $CI_REGISTRY_IMAGE:3.9
  only:
    - master

edge:
  stage: build
  variables:
    GIT_STRATEGY: clone
  script:
    - docker build --pull -t $CI_REGISTRY_IMAGE:edge . --build-arg BASE_IMAGE_VERSION=edge
    - docker run --rm $CI_REGISTRY_IMAGE:edge --version
    - docker push $CI_REGISTRY_IMAGE:edge
  only:
    - master

Stable:
  stage: version
  script:
    - docker pull $CI_REGISTRY_IMAGE:3.8
    - docker tag $CI_REGISTRY_IMAGE:3.8 $CI_REGISTRY_IMAGE:stable
    - docker push $CI_REGISTRY_IMAGE:stable
  only:
    - master

Latest:
  stage: version
  script:
    - docker pull $CI_REGISTRY_IMAGE:3.9
    - docker tag $CI_REGISTRY_IMAGE:3.9 $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - master

DockerHub:
  stage: release
  script:
    - export DOCKER_HUB_IMAGE="epicsoft/borgbackup"
    - docker login -u="$DOCKER_HUB_USER" -p="$DOCKER_HUB_PASS"
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $DOCKER_HUB_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $DOCKER_HUB_IMAGE:latest
    - docker push $DOCKER_HUB_IMAGE:stable
    - docker push $DOCKER_HUB_IMAGE:latest
  only:
    - master

QuayIO:
  stage: release
  script:
    - export QUAY_IO_IMAGE="quay.io/epicsoft/borgbackup"
    - docker login -u="$QUAY_IO_USER" -p="$QUAY_IO_PASS" quay.io
    - docker pull $CI_REGISTRY_IMAGE:stable
    - docker pull $CI_REGISTRY_IMAGE:latest
    - docker tag $CI_REGISTRY_IMAGE:stable $QUAY_IO_IMAGE:stable
    - docker tag $CI_REGISTRY_IMAGE:latest $QUAY_IO_IMAGE:latest
    - docker push $QUAY_IO_IMAGE:stable
    - docker push $QUAY_IO_IMAGE:latest
  only:
    - master
